<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Cadastro de Usuário</title>

    <link rel="favicon" type="favicon" href="favicon.ico" >
    
    <link rel="stylesheet" href="style.css" type="text/css">
</head>

<body>
    <form action="https://httpbin.dev/get" method="GET">

        <fieldset>
            <h1><legend>Dados Pessoais</legend></h1>

            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite...">
            </div>

            <div>
                <label for="rua">Rua:</label>
                <input type="text" id="rua" name="rua" placeholder="Digite...">
            </div>

            <div>
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" required placeholder="Digite...">
            </div>

            <div>
                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" placeholder="Adicione...">
            </div>

            <div>
                <label for="cidade">Cidades:</label>
                <select id="cidade" name="cidade" >
                <option value="value" >selecione a cidade</option>
                    <optgroup label="Cidade - PB">
                        <option value="Montadas">Montadas</option>
                        <option value="Areial">Areial</option>
                        <option value="Areia">Areia</option>
                        <option value="Lagoa de Roça">Lagoa de Roça</option>
                        <option value="Esperança">Esperança</option>
                        <option value="Pocinhos">Pocinhos</option>
                    </optgroup>
                </select>
            </div>

            <label for="genero">Gênero:</label>
            <input type="radio" id="masculino" name="Gênero" value="Masculino">
            <label for="masc">Masculino</label>

            <input type="radio" id="Feminino" name="Gênero" value="Feminino">
            <label for="fem">Feminino</label>

            <input type="radio" id="Outro" name="Gênero" value="Outro">
            <label for="out">Outro</label>



            <div>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite">
            </div>

            <div>
                <button type="submit">Enviar</button>
                <button type="reset">Limpar</button>

            </div>
            
            

        </fieldset>
    </form>
</body>

</html>
